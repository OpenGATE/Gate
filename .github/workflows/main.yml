
name: CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  schedule:
    - cron: '0 0 * * 0,3'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        options: [none, rtk, torch, optic]
        exclude:
          - os: macos-latest
            options: torch

    env:
      ROOT_VERSION: 'v6-32-04'
      ITK_VERSION: 'v5.4.2'
      GEANT4_VERSION: 'v11.4.0'
      ROOT_DIR: $(HOME)/software/root
      GEANT4_DIR: $(HOME)/software/geant4

    steps:
    - name: Checkout github repo
      uses: actions/checkout@v3
      with:
          lfs: true
    - name: Checkout LFS objects
      run: git lfs checkout
    - name: Cache
      id: cache_gate_dependencies
      uses: actions/cache@v3
      with:
        path: ~/software
        key: ${{ matrix.os }}-geant4-${{ env.GEANT4_VERSION }}-root-${{ env.ROOT_VERSION }}-qt6-build0
        restore-keys: ${{ matrix.os }}-geant4-${{ env.GEANT4_VERSION }}-root-${{ env.ROOT_VERSION }}-qt6-build0
    - name: Install dependencies
      run: |
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          sudo apt-get update -qq
          sudo apt-get install -y gcc \
                                  g++ \
                                  make \
                                  binutils \
                                  libx11-dev \
                                  libtbb-dev \
                                  libxpm-dev \
                                  libxft-dev \
                                  libxext-dev \
                                  qt6-base-dev \
                                  qt6-base-dev-tools \
                                  qt6-tools-dev \
                                  qt6-tools-dev-tools \
                                  git \
                                  cmake \
                                  libssl-dev \
                                  python3.8-dev \
                                  ccache \
                                  libfftw3-dev
          gcc -v
        elif [ "${{ matrix.os }}" == "macos-latest" ]; then          
          brew update || true
          brew install python@3.12 || true
          
          brew link --overwrite --force python@3.12
          export Python3_EXECUTABLE="$(brew --prefix python@3.12)/bin/python3"

          #rm -rf /usr/local/bin/python3.11-config /usr/local/bin/2to3-3.11 /usr/local/bin/idle3.11 /usr/local/bin/pydoc3.11 /usr/local/bin/python3.11
          #rm -rf /usr/local/bin/python3-config /usr/local/bin/2to3 /usr/local/bin/idle3 /usr/local/bin/pydoc3 /usr/local/bin/python3
          brew install --force --verbose --overwrite --debug qt \
                                                             ccache \
                                                             tbb \
                                                             xrootd \
                                                             fftw
          
          #brew link qt --force && sudo ln -s /usr/local/opt/qt/mkspecs /usr/local/mkspecs && sudo ln -s /usr/local/opt/qt/plugins /usr/local/plugins
          brew cleanup
          #export PATH=/usr/local/opt/qt/bin:$PATH
          #export LDFLAGS="-L/usr/local/opt/qt/lib -L/usr/local/opt/llvm/lib"
          #export CPPFLAGS="-I/usr/local/opt/qt/include -I/usr/local/opt/llvm/include -fopenmp"
          
          #export Qt6_DIR="$(brew --prefix qt)/lib/cmake/Qt6"
          #export CMAKE_PREFIX_PATH="$(brew --prefix qt):$CMAKE_PREFIX_PATH"
          #export Qt6_DIR="$(brew --prefix qt)/lib/cmake/Qt6"

          #QT_PREFIX="$(brew --prefix qt)"
          #export Qt6_DIR="$QT_PREFIX/lib/cmake/Qt6"
          LLVM_PREFIX="$(brew --prefix llvm || true)"
          #export LDFLAGS="-L$QT_PREFIX/lib ${LLVM_PREFIX:+-L$LLVM_PREFIX/lib}"
          #export CPPFLAGS="-I$QT_PREFIX/include ${LLVM_PREFIX:+-I$LLVM_PREFIX/include}"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export MACOSX_DEPLOYMENT_TARGET=13.0
          cmake --version
          which cmake
          
        fi
        cd $HOME/
        mkdir -p software option_dependencies
        cmake --version
    - name: Install root
      run: |
        if [ "${{ steps.cache_gate_dependencies.outputs.cache-hit }}" != 'true' ] && [ "${{ matrix.options }}" == 'none' ]; then
          cd $HOME/software
          mkdir root
          cd root
          mkdir -p src bin install
          git clone  --branch $ROOT_VERSION https://github.com/root-project/root.git --depth 1 src
          rm -rf bin
          mkdir -p bin
          cd bin
          cmake ../src -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_BUILD_TYPE=Release "-Dalien=off" "-Dall=off" "-Darrow=off" "-Dasan=off" "-Dasimage=on" "-Dasserts=off" "-Dbuiltin_cfitsio=on" "-Dbuiltin_clang=on" "-Dbuiltin_cling=on" "-Dbuiltin_cppzmq=on" "-Dbuiltin_davix=on" "-Dbuiltin_fftw3=on" "-Dbuiltin_freetype=on" "-Dbuiltin_ftgl=on" "-Dbuiltin_gl2ps=on" "-Dbuiltin_glew=on" "-Dbuiltin_gsl=on" "-Dbuiltin_gtest=on" "-Dbuiltin_llvm=on" "-Dbuiltin_lz4=on" "-Dbuiltin_lzma=on" "-Dbuiltin_nlohmannjson=on" "-Dbuiltin_openssl=on" "-Dbuiltin_openui5=on" "-Dbuiltin_pcre=on" "-Dbuiltin_tbb=on" "-Dbuiltin_unuran=on" "-Dbuiltin_vc=off" "-Dbuiltin_vdt=on" "-Dbuiltin_veccore=on" "-Dbuiltin_xrootd=on" "-Dbuiltin_xxhash=on" "-Dbuiltin_zeromq=on" "-Dbuiltin_zlib=off" "-Dbuiltin_zstd=on" "-Dccache=on" "-Dcefweb=off" "-Dclad=on" "-Dclingtest=off" "-Dcocoa=on" "-Dcoverage=off" "-Dcuda=off" "-Ddaos=off" "-Ddataframe=on" "-Ddavix=on" "-Ddcache=off" "-Ddev=off" "-Ddistcc=off" "-Dfail-on-missing=on" "-Dfcgi=off" "-Dfftw3=on" "-Dfitsio=on" "-Dfortran=off" "-Dgdml=on" "-Dgminimal=off" "-Dgnuinstall=off" "-Dgsl_shared=off" "-Dgviz=off" "-Dhttp=on" "-Dimt=on" "-Djemalloc=off" "-Dlibcxx=off" "-Dmacos_native=off" "-Dmathmore=on" "-Dmemory_termination=off" "-Dminimal=off" "-Dmpi=off" "-Dmysql=off" "-Dodbc=off" "-Dopengl=on" "-Dpgsql=off" "-Dpyroot=on" "-Dpythia8=off" "-Dqt6web=off" "-Dr=off" "-Droofit=on" "-Droofit_multiprocess=on" "-Droot7=on" "-Drootbench=off" "-Droottest=on" "-Droottest_force_checkout=off" "-Drpath=on" "-Druntime_cxxmodules=on" "-Dshadowpw=off" "-Dshared=on" "-Dsoversion=off" "-Dspectrum=on" "-Dsqlite=on" "-Dssl=on" "-Dtcmalloc=off" "-Dtest_distrdf_dask=on" "-Dtest_distrdf_pyspark=on" "-Dtesting=on" "-Dtmva-cpu=on" "-Dtmva-cudnn=off" "-Dtmva-gpu=off" "-Dtmva-pymva=off" "-Dtmva-rmva=off" "-Dtmva-sofie=on" "-Dtmva=on" "-Dunfold=on" "-Dunuran=on" "-During=off" "-Dvc=off" "-Dvdt=on" "-Dveccore=off" "-Dvecgeom=off" "-Dwebgui=on" "-Dwin_broken_tests=off" "-Dwinrtdebug=off" "-Dx11=off" "-Dxml=on" "-Dxrootd=on" -DCMAKE_INSTALL_PREFIX=$HOME/software/root/install
          make -j4 install
          #echo "===== VDT CONFIGURE STDOUT ====="
          #cat /Users/runner/software/root/bin/VDT-prefix/src/VDT-stamp/VDT-configure-out.log || true
          #echo "===== VDT CONFIGURE STDERR ====="
          #cat /Users/runner/software/root/bin/VDT-prefix/src/VDT-stamp/VDT-configure-err.log || true
          #exit 1
          cd ..
          rm -rf bin src
        fi
    - name: Extract ROOT error (macOS)
      if: failure() && matrix.os == 'macos-latest'
      run: |
        echo "=== tail root_build.log (300 lines) ==="
        tail -n 300 "$HOME/root_build.log" || true
        echo "=== grep error lines ==="
        egrep -n "error:|fatal error:|ld:|Undefined symbols|undefined symbol|clang:|c\\+\\+:|collect2:|libtool:" \
          "$HOME/root_build.log" | tail -n 120 || true
        echo "=== first error context (80 lines around) ==="
        first=$(egrep -n "fatal error:|error:|ld:" "$HOME/root_build.log" | head -n 1 | cut -d: -f1)
        if [ -n "$first" ]; then
          start=$((first-80)); if [ $start -lt 1 ]; then start=1; fi
          end=$((first+80))
          sed -n "${start},${end}p" "$HOME/root_build.log" || true
        fi
    - name: Install Geant4
      run: |
        if [ "${{ steps.cache_gate_dependencies.outputs.cache-hit }}" != 'true' ] && [ "${{ matrix.options }}" == 'none' ]; then
          cd $HOME/software
          mkdir geant4
          cd geant4
          mkdir src bin install data
          git clone  --branch $GEANT4_VERSION https://github.com/Geant4/geant4.git --depth 1 src
          cd bin
          cmake -DGEANT4_INSTALL_DATA=ON \
                -DGEANT4_BUILD_MULTITHREADED=OFF \
                -DGEANT4_USE_QT=ON \
                -DGEANT4_INSTALL_DATADIR=$HOME/software/geant4/data \
                -DCMAKE_INSTALL_PREFIX=$HOME/software/geant4/install \
                -DQt6_DIR="$Qt6_DIR" \
                ../src
          make -j4 install
          cd ..
          rm -rf src bin
        fi
    - name: Install option dependencies
      run: |
        if [ "${{ steps.cache_gate_dependencies.outputs.cache-hit }}" == 'true' ]; then
          cd $HOME/option_dependencies
          if [ "${{ matrix.options }}" == 'torch' ]; then
            if [ "${{ matrix.os }}" == 'ubuntu-latest' ]; then
              wget https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-1.10.1%2Bcpu.zip
              unzip libtorch-cxx11-abi-shared-with-deps-1.10.1+cpu.zip
            elif [ "${{ matrix.os }}" == 'macos-latest' ]; then
              wget https://download.pytorch.org/libtorch/cpu/libtorch-macos-arm64-2.2.0.zip
              unzip libtorch-macos-arm64-2.2.0.zip
            fi
          fi
          if [ "${{ matrix.options }}" == 'rtk' ]; then
            mkdir rtk
            cd rtk
            mkdir src bin
            git clone --branch $ITK_VERSION https://github.com/InsightSoftwareConsortium/ITK.git --depth 1 src
            cd bin
            cmake -DCMAKE_CXX_FLAGS="-std=c++17" -DBUILD_TESTING=OFF -DITK_USE_FFTWD=ON -DITK_USE_FFTWF=ON -DITK_USE_SYSTEM_FFTW:BOOL=ON -DITK_MINIMUM_COMPLIANCE_LEVEL=3 -DModule_RTK=ON -DREMOTE_GIT_TAG_RTK=master ../src
            make -j4
          fi
          cd $HOME/option_dependencies
          ls
        else
          if [ "${{ matrix.options }}" != 'none' ]; then
            echo "Create the cache first and run the job again"
            exit 1
          fi
        fi
    - name: Configure Gate
      run: |
        if [ "${{ steps.cache_gate_dependencies.outputs.cache-hit }}" == 'true' ]; then
          cd $HOME
          export ROOTSYS=$HOME/software/root/install
          export PATH=${ROOTSYS}:${PATH}
          source $HOME/software/root/install/bin/thisroot.sh
          source $HOME/software/geant4/install/bin/geant4.sh 
          mkdir build
          cd build
          which cmake
          cmake --version
          export GATE_USE_TORCH=OFF
          export GATE_USE_RTK=OFF
          export GATE_USE_OPTICAL=OFF
          if [ "${{ matrix.options }}" == 'torch' ]; then
            export GATE_USE_TORCH=ON
          fi
          if [ "${{ matrix.options }}" == 'rtk' ]; then
            export GATE_USE_RTK=ON
          fi
          if [ "${{ matrix.options }}" == 'optic' ]; then
            export GATE_USE_OPTIC=ON
          fi
          cmake -DGATE_USE_TORCH=$GATE_USE_TORCH \
                -DTorch_DIR=$HOME/option_dependencies/libtorch/share/cmake/Torch \
                -DGATE_COMPILE_GATEDIGIT=ON \
                -DGATE_USE_RTK=$GATE_USE_RTK \
                -DITK_DIR=$HOME/option_dependencies/rtk/bin/ \
                -DGATE_USE_OPTICAL=$GATE_USE_OPTICAL \
                -DBUILD_TESTING=ON \
                $GITHUB_WORKSPACE
        fi
    - name: Build Gate
      run: |
        if [ "${{ steps.cache_gate_dependencies.outputs.cache-hit }}" == 'true' ]; then
          cd $HOME/build
          export ROOTSYS=$HOME/software/root/install
          export PATH=${ROOTSYS}:${PATH}
          source $HOME/software/root/install/bin/thisroot.sh
          source $HOME/software/geant4/install/bin/geant4.sh
          make -j4
          if [ ! $? -eq 0 ]; then
            exit 1
          fi
        fi

